plugins {
    id 'com.diffplug.spotless' version '6.25.0' apply false
}

subprojects {
    apply plugin: 'com.diffplug.spotless'
    group = 'dev.example.bricklayer'
    repositories {
        mavenCentral()
    }
    spotless {
        java {
            target 'src/**/*.java'
            googleJavaFormat('1.22.0')
            licenseHeaderFile rootProject.file('gradle/license-header.txt')
        }
    }
}
