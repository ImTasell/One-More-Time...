name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.flags.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - id: flags
        run: |
          case $GITHUB_REF_NAME in
            *-*) echo prerelease=true >> $GITHUB_OUTPUT ;;
            *)   echo prerelease=false >> $GITHUB_OUTPUT ;;
          esac
      - run: ./gradlew spotlessCheck :core:test :mod:build
      - name: Checksums
        run: cd mod/build/libs && sha256sum *.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            mod/build/libs/*.jar
            mod/build/libs/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.jar
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease }}
      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/*.jar
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          version-type: ${{ needs.build.outputs.prerelease == 'true' && 'beta' || 'release' }}
