name: Nightly NeoForge canary

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Resolve newest NeoForge 21.1.x
        id: neo
        run: |
          latest=$(curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml \
            | grep -oE '<version>21\.1\.[0-9]+</version>' \
            | sed -E 's/<[^>]+>//g' | sort -V | tail -1)
          echo version=$latest >> $GITHUB_OUTPUT
      - name: Build against it
        run: ./gradlew :mod:build -Pneo_version=${{ steps.neo.outputs.version }}
      - name: Open or update canary issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const body = 'Canary failed against NeoForge ${{ steps.neo.outputs.version }}. Run: ' + url;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'canary' });
            if (open.length === 0) {
              await github.rest.issues.create({ ...context.repo, title: 'Nightly canary failing against newer NeoForge', body, labels: ['canary'] });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            }
