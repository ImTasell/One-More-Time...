name: Benchmark (manual)

on:
  workflow_dispatch:
    inputs:
      filter:
        description: JMH include regex
        default: '.*'

permissions:
  contents: read

jobs:
  jmh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :core:jmh -PjmhFilter='${{ inputs.filter }}'
      - uses: actions/upload-artifact@v7
        with:
          name: jmh-results
          path: core/build/results/jmh/
